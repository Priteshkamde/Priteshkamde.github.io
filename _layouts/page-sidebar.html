---
layout: default
---
<div class="container">
<div class="page-shell">
<h1 class="page-title">{{page.title}}</h1>
<div class="row">
    <div class="col-md-8">
    {% if page.image %} 
    <img class="card-img-top mb-5 shadow-lg page-hero-media" src="{% if page.image contains "://" %}{{ page.image }}{% else %}{{ page.image | absolute_url }}{% endif %}" alt="{{ page.title }}"> 
    {% endif %} 
    <div class="page-content">
        {{ content }}
        <!-- Comments -->
        {% if page.comments == true %}
        {% include comments.html %}
        {% endif %}
    </div>
    </div>
    <div class="col-md-4">
        {% include sidebar.html %}
    </div>
</div>  
</div>
</div>
